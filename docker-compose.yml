services:
  db:
    image: postgres:18
    env_file: .env
    environment:
      # initdb takes the server's time zone from TZ, so NOW() and LOCALTIMESTAMP are Danish local time
      TZ: Europe/Copenhagen
    volumes:
      # A new name instead of db-data, so an old MySQL volume is never mounted into PostgreSQL (006)
      - pg-data:/var/lib/postgresql
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # TCP, so the container only reports healthy after the init scripts have run (KB-T4)
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 3s
      retries: 40
      start_period: 60s

  backend:
    build: ./backend
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      TZ: Europe/Copenhagen
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./db:/db

  frontend:
    build: ./frontend
    ports:
      - '5173:5173'
    volumes:
      - ./frontend:/app
      - /app/node_modules

  swagger:
    image: swaggerapi/swagger-ui
    environment:
      SWAGGER_JSON: /spec/openapi.yaml
      BASE_URL: /docs
    volumes:
      - ./backend/openapi.yaml:/spec/openapi.yaml:ro

volumes:
  pg-data:
